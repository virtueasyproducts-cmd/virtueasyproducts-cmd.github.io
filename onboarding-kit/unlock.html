  <h1>Unlocking your Onboarding Kit</h1>
  <p class="note">Confirming your purchase and setting up your access…</p>
</div>
<script>
(async function(){
  const API = "https://virtueasy-pricing-tool-verification.morgan-2bf.workers.dev";
  const TOKEN_KEY = "ok-access-token";
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("session_id") || "";
  if (sessionId) history.replaceState(null, "", window.location.pathname);
  let existingToken = null;
  try { existingToken = localStorage.getItem(TOKEN_KEY); } catch(e) {}

  // Meta's browser cookies. Forwarded so the Worker's server-side Purchase
  // can be matched to this visitor and deduped against the browser event.
  function cookie(name){
    var m = document.cookie.match("(^|; )" + name + "=([^;]*)");
    return m ? decodeURIComponent(m[2]) : "";
  }

  function fail(msg){
    document.querySelector(".note").textContent = msg || "We couldn't confirm your purchase. Taking you to sign in…";
    setTimeout(function(){ window.location.href = "login.html"; }, 2600);
  }

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "product-unlock", product: "onboarding", session_id: sessionId, token: existingToken || "",
        fbp: cookie("_fbp"), fbc: cookie("_fbc"), source_url: window.location.origin + window.location.pathname }),
    });
    const data = await res.json();
    if (data.token) {
      try { localStorage.setItem(TOKEN_KEY, data.token); } catch(e) {}
      if (sessionId && typeof window.clarity === "function") {
        try { clarity("event", "purchase"); } catch(e) {}
      }
      // Only on a fresh Stripe redirect - a returning token holder is not a new sale.
      if (sessionId && typeof window.fbq === "function") {
        fbq("track", "Purchase", {
          value: 7.00, currency: "USD",
          content_name: "VA Client Onboarding Kit",
          content_ids: ["onboarding"], content_type: "product", num_items: 1
        }, { eventID: "purchase_onboarding_" + sessionId });
      }
      setTimeout(function(){ window.location.href = "ok-2026-access.html"; }, 1200);
    } else {
      console.error("Onboarding Kit unlock failed:", data);
      var reason = data && data.reason ? " (" + data.reason + ")" : "";
      fail("We couldn't confirm your purchase" + reason + ". Taking you to sign in…");
    }
  } catch (e) {
    console.error("Onboarding Kit unlock error:", e);
    fail("We hit a snag confirming your purchase. Taking you to sign in…");
  }
})();
</script>
