<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Virtueasy</title>
<meta name="robots" content="noindex">
<script>
  // Any legacy Blueprint or 30-Day VA System URL lands on the Starter Kit,
  // which replaced both products. Everything else gets the 404 below.
  (function () {
    var p = location.pathname.toLowerCase();
    if (p.indexOf("blueprint") !== -1 || p.indexOf("30-day") !== -1 || p.indexOf("30day") !== -1 || p.indexOf("va-system") !== -1) {
      location.replace("/starterkit/");
    }
  })();
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #0A0A0A;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
  .wrap { max-width: 28rem; text-align: center; }
  h1 { font-size: 2rem; margin: 0 0 0.75rem; }
  p { line-height: 1.6; color: #444; }
  a.btn { display: inline-block; margin-top: 1.25rem; padding: 0.75rem 1.5rem; background: #FF1F7A; color: #fff;
          text-decoration: none; border-radius: 8px; font-weight: 600; }
  a.plain { color: #FF1F7A; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Page not found</h1>
  <p>That page moved or never existed. The good stuff lives on the homepage, or jump straight to the <a class="plain" href="/starterkit/">VA Starter Kit</a>.</p>
  <a class="btn" href="/">Go to Virtueasy</a>
</div>
</body>
</html>
